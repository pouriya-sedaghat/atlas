name: Verify source and release registry
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: node@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
    services:
      db:
        image: postgis/postgis@sha256:1ac10b2551ba84ae05db8e7da477afcd0a3fede99bcb7705da2ee157390cb095
        env:
          POSTGRES_DB: atlas_test_registry
          POSTGRES_USER: atlas_ci
          POSTGRES_PASSWORD: disposable-ci-only
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U atlas_ci -d atlas_test_registry"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      ATLAS_TEST_DATABASE_URL: postgresql://atlas_ci:disposable-ci-only@db:5432/atlas_test_registry
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Refuse cleanup when the metadata integration test rejects a database
        run: node tools/check-metadata-test-guard.mjs
      - name: Preserve SQL and HTTP verification failures
        run: node tools/check-tile-check-failure.mjs
      - name: Verify published experimental candidate evidence
        run: node tools/verify-candidate-evidence.mjs
      - name: Verify recorded rejected catalog attempt
        run: node tools/verify-catalog-attempt-evidence.mjs
      - name: Refuse forged catalog evidence after checksum regeneration
        run: node tools/fault-check-catalog-attempt-evidence.mjs
      - name: Verify recorded durable guard and bounded I/O evidence
        run: node tools/verify-serving-guard-evidence.mjs
      - name: Reject a late successful HTTP observation after an event-loop stall
        run: node tools/check-observer-deadline.mjs
      - name: Verify recorded paused admission and rejected long I/O experiment
        run: node tools/verify-admission-evidence.mjs
      - name: Refuse erasing I/O failures, admission policy and unknown collector totals
        run: node tools/fault-check-admission-evidence.mjs
  pbf-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: |
          python3 -m venv /tmp/atlas-audit
          /tmp/atlas-audit/bin/pip install --no-deps -r tools/pbf-audit/requirements.txt
          /tmp/atlas-audit/bin/python -m unittest discover -s tools/pbf-audit
          /tmp/atlas-audit/bin/python tools/pbf-audit/build_conformance_fixture.py /tmp/conformance.osm.pbf
          /tmp/atlas-audit/bin/python tools/pbf-audit/audit.py /tmp/conformance.osm.pbf --out /tmp/conformance-audit.json
          python3 -m unittest discover -s apps/ingest/test
  audit-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker build -t atlas-audit-ci -f infra/atlas/intake/Dockerfile.audit .
      - run: |
          mkdir -p /tmp/atlas-sandbox-fixture
          docker run --rm --network none --read-only --cap-drop ALL --user "$(id -u):$(id -g)" \
            -v "$PWD:/src:ro" -v /tmp/atlas-sandbox-fixture:/out --entrypoint python atlas-audit-ci \
            -I /src/tools/pbf-audit/build_conformance_fixture.py /out/conformance.osm.pbf
          chmod 444 /tmp/atlas-sandbox-fixture/conformance.osm.pbf
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 64 --memory 512m --memory-swap 512m --cpus 1 --log-driver none \
            --mount type=bind,src=/tmp/atlas-sandbox-fixture/conformance.osm.pbf,dst=/in/input.osm.pbf,readonly \
            atlas-audit-ci > /tmp/atlas-sandbox-fixture/report.json
          python3 -c "import json; r=json.load(open('/tmp/atlas-sandbox-fixture/report.json')); assert r['structural_status']=='passed'; assert r['counts']=={'node':152,'way':39,'relation':5}"
      - name: Verify real osm2pgsql catalog outcomes on fictional geometry
        run: python3 tools/catalog-smoke.py
