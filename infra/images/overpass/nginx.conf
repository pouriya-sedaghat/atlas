# Private Overpass HTTP front: only the interpreter and status CGIs, fixed paths, no listing.
worker_processes 2;
pid /tmp/overpass-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  client_max_body_size 16k;
  server_tokens off;
  server {
    listen 8080;
    location = /api/interpreter { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME /opt/overpass/cgi-bin/interpreter; fastcgi_param OVERPASS_DB_DIR /data/overpass/db/; fastcgi_param OVERPASS_SOCKET_DIR /run/overpass/; fastcgi_read_timeout 60s; fastcgi_pass unix:/tmp/fcgiwrap.sock; }
    location = /api/status { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME /opt/overpass/cgi-bin/status; fastcgi_param OVERPASS_DB_DIR /data/overpass/db/; fastcgi_param OVERPASS_SOCKET_DIR /run/overpass/; fastcgi_pass unix:/tmp/fcgiwrap.sock; }
    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }
  }
}
