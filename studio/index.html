<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230c1017'/%3E%3Cpath d='M2 12 L7 4 L9 9 L14 5' stroke='%23ffd166' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Atlas Studio</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header>
          <h1>Atlas Studio</h1>
          <p>Viewport queries against the Atlas map API.</p>
          <div id="status-bar"></div>
        </header>

        <section class="panel">
          <h2>Dataset</h2>
          <div id="dataset-panel"></div>
        </section>

        <section class="panel">
          <h2>Import warnings</h2>
          <div id="warnings-panel"></div>
        </section>

        <section class="panel">
          <h2>Query diagnostics</h2>
          <div id="diagnostics-panel"></div>
          <div class="controls">
            <label>
              <input id="toggle-debug" type="checkbox" />
              Request <code>include=source,diagnostics</code>
            </label>
          </div>
        </section>

        <section class="panel">
          <h2>Feature inspector</h2>
          <div id="inspector-panel"></div>
        </section>

        <footer id="attribution">
          Map data ©
          <a
            href="https://www.openstreetmap.org/copyright"
            target="_blank"
            rel="noreferrer noopener"
            >OpenStreetMap contributors</a
          >
        </footer>
      </aside>

      <div id="map-shell">
        <div id="map"></div>
        <div id="banner" hidden></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
